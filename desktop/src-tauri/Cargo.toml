[package]
name = "omniagent-desktop"
version = "0.1.0"
description = "OmniAgent desktop IDE shell"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "linux")'.dependencies]
# Only used for PR_SET_PDEATHSIG — see spawn_server() in main.rs. This is
# how the spawned Python server avoids becoming an orphaned, leaked process
# if this app is killed uncatchably (SIGKILL/force-quit), which no amount
# of signal-handling code in this process can react to after the fact.
libc = "0.2"

[[bin]]
name = "omniagent-desktop"
path = "src/main.rs"
